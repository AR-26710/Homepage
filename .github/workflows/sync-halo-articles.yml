name: Sync Halo Articles

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run sync script
        env:
          HALO_API_URL: ${{ secrets.HALO_API_URL }}
          HALO_LATEST_PATH: ${{ secrets.HALO_LATEST_PATH || '/archives' }}
          HALO_CATEGORY_PATH_PREFIX: ${{ secrets.HALO_CATEGORY_PATH_PREFIX || '/categories' }}
          HALO_ARTICLES_PER_CATEGORY: ${{ secrets.HALO_ARTICLES_PER_CATEGORY || '5' }}
        run: node scripts/sync-halo-articles.js

      - name: Push changes
        run: |
          git push origin main
